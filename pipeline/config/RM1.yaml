# RM1. shift_tol is per slicer: a clean Large setup spreads 84 A and a clean
# Small setup spreads 106 A, so the 50 A tolerance used on the RH gratings
# reports a good setup as shifted. 6630 is the one angle where PypeIt's own
# template gates clean. 2024-04-01 A is clean; 2024-04-01 B needs the dead
# column excluded, and the window is not the RH1 window.
grating: RM1
polyorder: 5
bridge: 5
lamps: null
boxcar_arcsec: 3.4
exptime_floor_s: 10
min_frames: 2
max_airmass_spread: 0.10
count_rate_floor: null
slice_span_A: [1200, 1700]
shift_tol_A:
  Large: 100
  Small: 120
nline_min: 20

templates:
  "6130 Small": templates/keck_kcrm_RM1_6130_small.fits
  "6200 Large": templates/keck_kcrm_RM1_6300.fits
  "6300 Large": templates/keck_kcrm_RM1_6300.fits
  "6480 Large": templates/keck_kcrm_RM1_6300.fits
  "6630 Large": shipped
  "7390 Small": templates/keck_kcrm_RM1_7390_small.fits
  "7510 Large": templates/keck_kcrm_RM1_7510.fits

exclude_regions:
  "2024-04-01/B": "1:642:656,"

flag:
  "feige34_2024-03-15_B": "-6.9 percent against its own grating, kept as a lower limit"
