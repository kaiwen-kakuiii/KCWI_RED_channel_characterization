# RH2. One template per slicer: line width in Angstroms changes with the
# slicer, and a Large template does not solve a Medium setup. The Large file
# is the stitched 2918 px template that gated 24/24; it is wider than one
# exposure and is not rebuilt here. 7180 Large is the seed night (2/24 before
# the template) and is not in the published blaze.
grating: RH2
polyorder: 15
bridge: 0
lamps: null
boxcar_arcsec: 3.4
exptime_floor_s: 10
min_frames: 2
max_airmass_spread: 0.10
count_rate_floor: null
slice_span_A: [400, 900]
shift_tol_A: 50
nline_min: 20

templates:
  "6750 Medium": templates/keck_kcrm_RH2_medium.fits
  "6900 Large": templates/keck_kcrm_RH2.fits
  "6950 Large": templates/keck_kcrm_RH2.fits
  "7100 Large": templates/keck_kcrm_RH2.fits
  "7180 Large": templates/keck_kcrm_RH2.fits
