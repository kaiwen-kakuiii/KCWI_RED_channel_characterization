# RH4. One night, cenwave 9950, two standards in the same setup. The default
# line list has about six lines in band. Slice span is ~985 A, outside the
# 400-900 A window used for RH1 and RH2.
grating: RH4
polyorder: 15
bridge: 0
lamps: ThArRH4
boxcar_arcsec: 3.4
exptime_floor_s: 10
min_frames: 2
max_airmass_spread: 0.10
count_rate_floor: null
slice_span_A: [800, 1200]
shift_tol_A: 50
nline_min: 20

templates:
  "9950 Large": templates/keck_kcrm_RH4.fits
