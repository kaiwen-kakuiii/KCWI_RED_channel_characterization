# RL. PypeIt ships keck_kcrm_RL.fits and the historical reductions did not
# override it. slice_span and shift_tol were measured on the 2024-12-28 B
# spec2d: one slice spans 3791-3971 A, and the blue ends sit up to 286 A from
# their median. 400 A of shift tolerance clears that spread. A wrong window of
# only ~300 A can hide inside it; the gate that matters here is 24 slices
# inside the span window.
grating: RL
polyorder: 15
bridge: 0
lamps: null
boxcar_arcsec: 3.4
exptime_floor_s: 10
min_frames: 2
max_airmass_spread: 0.10
count_rate_floor: null
slice_span_A: [3400, 4500]
shift_tol_A: 400
nline_min: 20

templates:
  "7150 Large": shipped
  "7150 Medium": shipped
  "7250 Medium": shipped
  "7800 Medium": shipped
  "8000 Medium": shipped
  "8100 Medium": shipped
